<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Articles by Frontend Developer">
    <meta name="keywords" content="Frontend Developer Articles, Blog, HTML">
    <meta name="author" content="Your Name">
    <title>Articles | Frontend Developer</title>
    <style>
        :root {
            --primary: #1976d2;
            --secondary: #e3f2fd;
            --accent: #1565c0;
            --text: #222;
            --header-bg: var(--secondary);
            --footer-bg: #f5f5f5;
            --border-radius: 12px;
            --shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fafbfc;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--header-bg);
            border-bottom: 4px solid var(--primary);
            padding: 2em 1em 1em 1em;
            text-align: center;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: var(--shadow);
        }
        header h1 {
            font-size: 2.2em;
            color: var(--primary);
            margin-bottom: 0.5em;
            letter-spacing: 2px;
        }
        nav {
            margin-top: 0.5em;
        }
        nav a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin: 0 0.7em;
            transition: color 0.2s;
            font-size: 1.05em;
        }
        nav a:hover, nav a:focus {
            color: var(--primary);
            text-decoration: underline;
        }
        main {
            flex: 1;
            max-width: 700px;
            margin: 2em auto;
            padding: 1.5em;
            background: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        h2 {
            color: var(--primary);
            font-size: 1.7em;
            margin-bottom: 1.2em;
            text-align: center;
            letter-spacing: 1px;
        }
        article {
            background: var(--secondary);
            border-left: 5px solid var(--primary);
            border-radius: var(--border-radius);
            margin-bottom: 1.5em;
            padding: 1.2em 1.5em;
            box-shadow: 0 1px 4px rgba(25, 118, 210, 0.05);
            transition: transform 0.15s;
        }
        article:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 4px 16px rgba(25, 118, 210, 0.12);
        }
        article h3 {
            color: var(--accent);
            margin-bottom: 0.5em;
            font-size: 1.25em;
        }
        article p {
            color: #333;
            font-size: 1.05em;
            line-height: 1.6;
        }
        footer {
            background: var(--footer-bg);
            text-align: center;
            padding: 1.2em 0;
            color: #888;
            font-size: 1em;
            border-top: 1px solid #e0e0e0;
            margin-top: 2em;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }
        @media (max-width: 600px) {
            header {
                padding: 1.2em 0.5em 0.7em 0.5em;
            }
            main {
                padding: 1em 0.5em;
                margin: 1em 0.5em;
            }
            article {
                padding: 1em 0.7em;
            }
            h2 {
                font-size: 1.3em;
            }
            header h1 {
                font-size: 1.3em;
            }
            nav a {
                margin: 0 0.3em;
                font-size: 0.98em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>B-Frankie</h1>
        <nav>
            <a href="Homepage.html">Home</a> /
            <a href="projects.html">Projects</a> /
            <a href="articles.html">Articles</a> /
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Articles</h2>
        <article>
            <h3>How I Built My Portfolio</h3>
            <p>Details about building projects with only HTML.</p>
        </article>
        <article>
            <h3>Importance of Semantic HTML</h3>
            <p>Why semantic HTML is important for SEO and accessibility.</p>
        </article>
    </main>

    <footer>
        <p>&copy; All rights reserved 2025</p>
    </footer>
</body>
</html>
