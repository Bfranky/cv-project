<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Frontend Developer">
  <meta name="keywords" content="Contact, Frontend Developer, Portfolio">
  <meta name="author" content="Your Name">
  <title>Contact | Frontend Developer</title>
  <style>
    :root {
      --primary: #1976d2;
      --secondary: #e3f2fd;
      --accent: #1565c0;
      --text: #222;
      --background: #f9f9f9;
      --radius: 10px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--primary);
      padding: 1em;
      text-align: center;
      border-bottom: 2px solid var(--accent);
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 0.7em;
      font-weight: 500;
      transition: color 0.2s;
      font-size: 1.1em;
    }
    nav a:hover, nav a:focus {
      color: #ffe082;
      text-decoration: underline;
    }
    /* Hero Section */
    .hero {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: #fff;
      text-align: center;
      padding: 3em 1em;
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.15);
    }
    .hero h1 {
      margin: 0 0 0.5em 0;
      font-size: 2.4em;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hero p {
      font-size: 1.2em;
      margin: 0;
    }
    main {
      flex: 1;
      max-width: 420px;
      margin: 2em auto;
      background: #fff;
      padding: 2em 1.5em;
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(25, 118, 210, 0.08);
      width: -webkit-fill-available;
    }
    h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 1.5em;
      font-size: 1.7em;
      letter-spacing: 1px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.1em;
    }
    label {
      font-weight: 500;
      margin-bottom: 0.3em;
      color: var(--accent);
    }
    input, textarea {
      padding: 0.7em;
      border: 1px solid #b3c6e0;
      border-radius: var(--radius);
      font-size: 1em;
      background: var(--secondary);
      transition: border 0.2s;
      resize: vertical;
      width: -webkit-fill-available;
    }
    input:focus, textarea:focus {
      border: 1.5px solid var(--primary);
      outline: none;
      background: #fff;
    }
    button[type="submit"] {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.9em;
      border-radius: var(--radius);
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
      margin-top: 0.5em;
    }
    button[type="submit"]:hover, button[type="submit"]:focus {
      background: var(--accent);
    }
    footer {
      text-align: center;
      padding: 1.2em 0 0.7em 0;
      color: #888;
      font-size: 1em;
      margin-top: auto;
    }
    @media (max-width: 600px) {
      main {
        max-width: 98vw;
        padding: 1.2em 0.5em;
      }
      .hero h1 {
        font-size: 1.5em;
      }
      .hero p {
        font-size: 1em;
      }
      h2 {
        font-size: 1.2em;
      }
      nav a {
        font-size: 1em;
        margin: 0 0.3em;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="Homepage.html">Home</a> /
      <a href="projects.html">Projects</a> /
      <a href="articles.html">Articles</a> /
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>B-Frankie</h1>
    <p>Let’s build something amazing together</p>
  </section>

  <main>
    <h2>Contact Me</h2>
    <form onsubmit="alert('Thank you for contacting me!'); return false;" method="post" autocomplete="on">
      <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>
      <div>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>&copy; All rights reserved 2025</p>
  </footer>
</body>
</html>
