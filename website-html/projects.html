<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects by Frontend Developer">
    <meta name="keywords" content="HTML Projects, Portfolio, Frontend Developer">
    <meta name="author" content="Your Name">
    <title>Projects | Frontend Developer</title>
    <style>
        :root {
            --primary: #1976d2;
            --secondary: #e3f2fd;
            --accent: #1565c0;
            --text: #222;
            --white: #fff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            border-bottom: 4px solid var(--primary);
            background: var(--secondary);
            text-align: center;
            padding: 2em 1em 1em 1em;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.07);
        }
        header h1 {
            font-size: 2.2em;
            color: var(--primary);
            margin-bottom: 0.5em;
            letter-spacing: 2px;
        }
        nav {
            margin-top: 0.5em;
        }
        nav a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin: 0 0.7em;
            padding: 0.3em 0.7em;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }
        nav a:hover, nav a:focus {
            background: var(--primary);
            color: var(--white);
        }
        main {
            flex: 1;
            max-width: 600px;
            margin: 2em auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(25, 118, 210, 0.08);
            padding: 2em 1.5em;
            width: -webkit-fill-available;
        }
        main h2 {
            color: var(--primary);
            font-size: 1.7em;
            margin-bottom: 1em;
            text-align: center;
            letter-spacing: 1px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            background: var(--secondary);
            margin: 0.7em 0;
            padding: 1em 1.2em;
            border-radius: 8px;
            font-size: 1.1em;
            box-shadow: 0 1px 4px rgba(25, 118, 210, 0.05);
            transition: background 0.2s;
        }
        ul li:hover {
            background: #bbdefb;
        }
        footer {
            text-align: center;
            padding: 1.2em 0 1em 0;
            background: var(--secondary);
            color: var(--accent);
            font-size: 1em;
            border-top: 2px solid var(--primary);
            margin-top: auto;
        }
        @media (max-width: 700px) {
            main {
                max-width: 95vw;
                padding: 1.2em 0.5em;
            }
            header h1 {
                font-size: 1.5em;
            }
            main h2 {
                font-size: 1.2em;
            }
            ul li {
                font-size: 1em;
                padding: 0.7em 0.8em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>B-Frankie</h1>
        <nav>
            <a href="Homepage.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="articles.html">Articles</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>My Projects</h2>
        <ul>
            <li>HTML Only Portfolio</li>
            <li>Calculator</li>
            <li>Quiz App</li>
            <li>Countdown Timer</li>
            <li>Blog</li>
        </ul>
    </main>

    <footer>
        <p>&copy; All rights reserved 2025</p>
    </footer>
</body>
</html>
